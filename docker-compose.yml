volumes:
  postgres-data:
  kestra-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U kestra"]
      interval: 10s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v2.0.10
    restart: unless-stopped
    user: "root"
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./data:/app/data:ro
    environment:
      SNOWFLAKE_URL: ${SNOWFLAKE_URL:-}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/

  spark:
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
    profiles: ["spark"]
    restart: "no"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - net.snowflake:spark-snowflake_2.12:3.1.3
      - /opt/spark-app/build_obt.py
    volumes:
      - ./spark:/opt/spark-app:ro
    environment:
      SNOWFLAKE_URL: ${SNOWFLAKE_URL:?Set SNOWFLAKE_URL in .env}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:?Set SNOWFLAKE_USERNAME in .env}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:?Set SNOWFLAKE_DATABASE in .env}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:?Set SNOWFLAKE_WAREHOUSE in .env}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_GOLD_SCHEMA: ${SNOWFLAKE_GOLD_SCHEMA:-GOLD}
      SNOWFLAKE_OBT_TABLE: ${SNOWFLAKE_OBT_TABLE:-OBT_CUSTOMER_CHURN}
